# Deploy to k3s — push-to-deploy for the smoke service
# Triggered on push to main when manifests or the workflow change.
# Uses the gitops-deployer SA kubeconfig (repo secret KUBECONFIG_B64) —
# scoped, never root.
name: Deploy to k3s
on:
  push:
    branches: [main]
    paths: ['k8s.yaml', 'k8s/**', '.gitea/workflows/**']

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install kubectl
        run: |
          curl -sLO "https://dl.k8s.io/release/v1.36.2/bin/linux/amd64/kubectl"
          chmod +x kubectl
          mv kubectl /usr/local/bin/

      - name: Write kubeconfig
        run: |
          mkdir -p $HOME/.kube
          echo "${{ secrets.KUBECONFIG_B64 }}" | base64 -d > $HOME/.kube/config
          chmod 600 $HOME/.kube/config

      - name: Apply manifests
        run: |
          kubectl apply -f k8s.yaml
          kubectl rollout status deployment/smoke -n smoke --timeout=120s

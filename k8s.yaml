# k3s deployment for smoke — UTC timestamp smoke test
# Deploy: auto via Gitea Actions (rook-runner in-cluster)
# Uses stock python image + ConfigMap mount (no registry needed).
# Containerfile exists for the git-ops build path later.
---
apiVersion: v1
kind: Namespace
metadata:
  name: smoke
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: smoke-code
  namespace: smoke
data:
  server.py: |
    #!/usr/bin/env python3
    """Smoke test app — returns current UTC timestamp as JSON on /."""
    import json
    import time
    from http.server import BaseHTTPRequestHandler, HTTPServer


    class Handler(BaseHTTPRequestHandler):
        def do_GET(self):
            body = json.dumps({
                "utc": time.strftime("%Y-%m-%dT%H:%M:%SZ", time.gmtime()),
                "epoch": int(time.time()),
                "service": "smoke",
            }).encode()
            self.send_response(200)
            self.send_header("Content-Type", "application/json")
            self.send_header("Content-Length", str(len(body)))
            self.send_header("Cache-Control", "no-store")
            self.end_headers()
            self.wfile.write(body)

        def log_message(self, fmt, *args):
            print(f"[{self.log_date_time_string()}] {self.address_string()} {fmt % args}")


    if __name__ == "__main__":
        print("smoke listening on :8080")
        HTTPServer(("0.0.0.0", 8080), Handler).serve_forever()
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: smoke
  namespace: smoke
spec:
  replicas: 3
  selector:
    matchLabels:
      app: smoke
  template:
    metadata:
      labels:
        app: smoke
    spec:
      containers:
        - name: smoke
          image: docker.io/library/python:3.11-alpine
          command: ["python", "/app/server.py"]
          volumeMounts:
            - name: code
              mountPath: /app/server.py
              subPath: server.py
          ports:
            - containerPort: 8080
      volumes:
        - name: code
          configMap:
            name: smoke-code
---
apiVersion: v1
kind: Service
metadata:
  name: smoke
  namespace: smoke
spec:
  selector:
    app: smoke
  ports:
    - port: 80
      targetPort: 8080
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: smoke
  namespace: smoke
spec:
  entryPoints:
    - web
    - websecure
  routes:
    - match: Host(`smoke.ffilt.us`)
      kind: Rule
      services:
        - name: smoke
          port: 80
